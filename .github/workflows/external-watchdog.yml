# 明鉴外部看门狗 — 运行在 GitHub 基础设施上的独立第二台机器
# 完全独立于用户 PC, 不受本地执行者 (Claude Code) 控制或篡改
#
# 安全措施 (GitHub 2026 Security Roadmap 合规):
#   1. 所有第三方 action 钉住到 commit SHA (防止标签被恶意覆盖)
#   2. 最小权限令牌 (contents: read, 仅 issues: write 用于告警)
#   3. OIDC 无密钥认证 (id-token: write 仅用于 attestation)
#   4. 工件证明 (artifact attestation) — 看门狗结果可加密验证
#   5. 去重告警 — 同一问题不重复创建 Issue
#
# 触发方式:
#   1. 定时触发: 每 30 分钟 (UTC :07 和 :37, 避开整点拥堵)
#   2. 外部 API 触发: curl -X POST https://api.github.com/repos/<owner>/<repo>/dispatches/external-watchdog
#      (配合 cron-job.org 保活, 防止 60 天不活跃暂停)
#   3. 手动触发: GitHub Actions UI → Run workflow
#   4. 推送触发: 框架文件变更时自动验证

name: 明鉴外部看门狗 (External Watchdog)

on:
  schedule:
    # 每30分钟运行, 偏移避开整点拥堵 (:07 和 :37)
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      hours_threshold:
        description: '近期活动阈值 (小时)'
        required: false
        default: '2'
        type: string
  repository_dispatch:
    types: [external-watchdog]
  push:
    branches: [main, master]
    paths:
      - 'audit_chain.py'
      - 'watchdog_external.py'
      - 'mingjian_watchdog.py'
      - 'cross_verify.py'
      - 'front_router.py'
      - '.claude/tracking/audit-chain.jsonl'
      - '.claude/tracking/watchdog-snapshot.json'

permissions:
  contents: read
  issues: write
  actions: read
  id-token: write       # 仅用于 attestation (OIDC 无密钥)
  attestations: write    # 工件证明

jobs:
  external-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖 (仅 cryptography 用于 Ed25519 验证)
        run: pip install cryptography --quiet

      - name: 初始化完整性清单 (首次运行)
        run: |
          if [ ! -f .claude/tracking/integrity-manifest.json ]; then
            python watchdog_external.py --init-integrity
            echo "完整性清单已初始化"
          else
            echo "完整性清单已存在, 跳过初始化"
          fi

      - name: 重新生成框架基线 (适配 Linux LF 换行符)
        run: |
          python mingjian_watchdog.py --init
          echo "框架基线已从 GitHub 环境重新生成"

      - name: 执行外部看门狗
        id: watchdog
        run: |
          set +e
          python watchdog_external.py --json > /tmp/watchdog-result.json 2>&1
          EXIT_CODE=$?
          set -e
          cat /tmp/watchdog-result.json
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          HEALTH=$(python3 -c "import json; d=json.load(open('/tmp/watchdog-result.json')); print(d.get('health','ERROR'))")
          echo "health=$HEALTH" >> $GITHUB_OUTPUT
          # 提取首个失败检查用于 Issue 标题
          FIRST_FAIL=$(python3 -c "
          import json
          d=json.load(open('/tmp/watchdog-result.json'))
          for name, c in d.get('checks', {}).items():
              if not c.get('ok'): print(name); break
          ")
          echo "first_fail=$FIRST_FAIL" >> $GITHUB_OUTPUT

      - name: 上传看门狗结果
        uses: actions/upload-artifact@v4
        with:
          name: watchdog-result-${{ github.run_id }}
          path: /tmp/watchdog-result.json
          retention-days: 7

      # 工件证明: 看门狗结果可加密验证来源 (GitHub 2026 Attestation)
      - name: 生成工件证明
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: /tmp/watchdog-result.json
          subject-name: watchdog-result

      - name: 创建告警 Issue (仅在 FAIL/WARN 时)
        if: steps.watchdog.outputs.health != 'HEALTHY'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const result = JSON.parse(fs.readFileSync('/tmp/watchdog-result.json', 'utf8'));

            // 检查是否已有打开的外部看门狗告警 (去重)
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['watchdog-alert', 'external'],
              state: 'open',
              per_page: 5,
            });

            // 构建告警详情
            let body = `## 🔴 外部看门狗告警\n\n`;
            body += `**时间**: ${result.timestamp}\n`;
            body += `**健康状态**: ${result.health}\n`;
            body += `**运行者**: GitHub Actions (Run [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}))\n\n`;
            body += `### 检查详情\n\n`;
            body += `| 检查项 | 状态 | 消息 |\n`;
            body += `|--------|------|------|\n`;

            for (const [name, check] of Object.entries(result.checks)) {
              const status = check.ok ? '✅' : '❌';
              body += `| ${name} | ${status} | ${check.message} |\n`;
              if (!check.ok && check.errors) {
                for (const err of check.errors.slice(0, 3)) {
                  body += `| | | - ${err} |\n`;
                }
              }
              if (!check.ok && check.tampered) {
                for (const t of check.tampered) {
                  body += `| | | ⚠️ ${t.module}: ${t.known_hash} → ${t.current_hash} |\n`;
                }
              }
            }

            body += `\n### 这意味着什么\n\n`;
            body += `GitHub Actions 运行在独立于用户 PC 的基础设施上 (不同物理位置、不同 OS、不同网络)。`;
            body += `此告警表示外部看门狗检测到以下一项或多项异常:\n\n`;
            body += `- **审计链断裂**: 哈希链或 Ed25519 签名验证失败 (可能被篡改)\n`;
            body += `- **近期无活动**: 审计链超过阈值时间无新事件 (本地机器可能离线)\n`;
            body += `- **框架漂移**: 框架文件的 SHA-256 与基线不符 (文件被未授权修改)\n`;
            body += `- **本地看门狗失联**: 健康状态文件超过2小时未更新 (看门狗进程可能崩溃)\n`;
            body += `- **自完整性失败**: 看门狗自身模块被篡改\n\n`;
            body += `<details><summary>原始 JSON</summary>\n\n\`\`\`json\n${JSON.stringify(result, null, 2)}\n\`\`\`\n</details>`;

            // 去重: 如果已有相同告警, 追加评论而非新建 Issue
            const existingIssue = issues.find(i => i.title.includes('外部看门狗告警'));
            if (existingIssue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: `🔄 重复告警 — ${result.timestamp}\n首个失败检查: ${process.env.FIRST_FAIL || 'unknown'}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🔴 外部看门狗告警 — ${result.timestamp}`,
                body: body,
                labels: ['watchdog-alert', 'external'],
              });
            }

      - name: 自动关闭旧告警 (恢复正常时)
        if: steps.watchdog.outputs.health == 'HEALTHY'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['watchdog-alert', 'external'],
              state: 'open',
              per_page: 10,
            });

            for (const issue of issues) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `✅ 外部看门狗恢复正常 — ${new Date().toISOString()}`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }
